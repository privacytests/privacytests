name: Desktop tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  CI: true
  GITHUB_TOKEN: ${{ github.token }}
  # capture-website pulls in puppeteer; CI doesn't generate previews, so skip its Chrome download.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  desktop-tests:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        browser:
          - brave
          - chrome
          - duckduckgo
          - edge
          - firefox
          - librewolf
          - mullvad
          - opera
          - safari
          - tor
          - ungoogled
          - vivaldi
          - brave-nightly
          - chrome-nightly
          - duckduckgo-nightly
          - edge-nightly
          - firefox-nightly
          - opera-nightly
#          - safari-nightly
          - tor-nightly
          - vivaldi-nightly
        repetitions: [1, 2, 3, 4, 5]
        incognito: [off, on]
        # Default off so include rows with tor:on are added as new jobs
        # instead of merging into (and replacing) the normal brave/off jobs.
        tor: [off]
        # Tor Browser has no distinct incognito mode (and --incognito is a no-op).
        # Still copy tor results into private/ / nightly-private/ after the run.
        exclude:
          - browser: tor
            incognito: on
          - browser: tor-nightly
            incognito: on
        # Brave Tor windows don't fit in the matrix; add fixed iterations here instead.
        include:
          - { browser: brave, repetitions: 1, incognito: off, tor: on }
          - { browser: brave, repetitions: 2, incognito: off, tor: on }
          - { browser: brave, repetitions: 3, incognito: off, tor: on }
          - { browser: brave, repetitions: 4, incognito: off, tor: on }
          - { browser: brave, repetitions: 5, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: 1, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: 2, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: 3, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: 4, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: 5, incognito: off, tor: on }
    runs-on: macos-latest
    defaults:
      run:
        working-directory: scripts
    env:
      # Browser slug in the artifact name (matrix browser, plus -tor for Brave Tor windows).
      RESULT_BROWSER: ${{ matrix.tor == 'on' && format('{0}-tor', matrix.browser) || matrix.browser }}
      RESULT_PRIVATE: ${{ (matrix.incognito == 'on' || matrix.tor == 'on') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install mkcert
        run: |
          # macos-latest images ship with aws/tap pre-tapped but untrusted; brew warns on every command until trusted.
          brew trust aws/tap
          brew install mkcert
          mkcert -install

      - name: Install browser
        run: node desktop-install ${{ matrix.browser }}

      - name: Start DNS monitor
        run: sudo node monitor-dns.js &

      - name: Run tests
        run: |
          if [ "$RESULT_PRIVATE" = "true" ]; then
            RESULT_FILE="${RESULT_BROWSER}-private-${{ matrix.repetitions }}"
          else
            RESULT_FILE="${RESULT_BROWSER}-${{ matrix.repetitions }}"
          fi
          echo "RESULT_FILE=${RESULT_FILE}" >> "$GITHUB_ENV"
          node test --browser=${{ matrix.browser }}${{ matrix.incognito == 'on' && ' --incognito' || '' }}${{ matrix.tor == 'on' && ' --tor' || '' }} --out=../${RESULT_FILE}.json
          # Tor Browser has no distinct incognito mode; also include on the private-modes page.
          if [ "${{ matrix.browser }}" = "tor" ] || [ "${{ matrix.browser }}" = "tor-nightly" ]; then
            cp "../${RESULT_FILE}.json" "../${RESULT_BROWSER}-private-${{ matrix.repetitions }}.json"
            cp "../${RESULT_FILE}.html" "../${RESULT_BROWSER}-private-${{ matrix.repetitions }}.html"
          fi
        timeout-minutes: 90

      - name: Upload results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ env.RESULT_FILE }}-results
          path: |
            ${{ env.RESULT_FILE }}.json
            ${{ env.RESULT_FILE }}.html
            ${{ env.RESULT_BROWSER }}-private-${{ matrix.repetitions }}.json
            ${{ env.RESULT_BROWSER }}-private-${{ matrix.repetitions }}.html
            failure.png
          if-no-files-found: warn

  render-results:
    needs: desktop-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download test results
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: '*-results'

      - name: Render index, private, nightly, and nightly-private
        run: node render-multiple --dir=../artifacts --out-dir=..

      - name: Upload rendered pages
        uses: actions/upload-artifact@v6
        with:
          name: rendered-pages
          path: |
            index.html
            index.json
            private.html
            private.json
            nightly.html
            nightly.json
            nightly-private.html
            nightly-private.json
