name: Desktop tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  CI: true
  GITHUB_TOKEN: ${{ github.token }}
  # capture-website pulls in puppeteer; CI doesn't generate previews, so skip its Chrome download.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml
    with:
      runs-on: macos-latest

  desktop-tests:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        browser:
          - brave
          - chrome
          - duckduckgo
          - edge
          - firefox
          - librewolf
          - mullvad
          - opera
          - safari
          - tor
          - ungoogled
          - vivaldi
          - brave-nightly
          - chrome-nightly
          - duckduckgo-nightly
          - edge-nightly
          - firefox-nightly
          - opera-nightly
#          - safari-nightly
          - tor-nightly
          - vivaldi-nightly
        # Five env diversity slots (OS × arch), still numbered 1–5 so
        # render-multiple can aggregate them like prior same-host repetitions.
        # Slot 5 is a second macos-26 run for same-env flake signal.
        repetitions:
          - { id: 1, runner: macos-26 }
          - { id: 2, runner: macos-15 }
          - { id: 3, runner: macos-26-intel }
          - { id: 4, runner: macos-15-intel }
          - { id: 5, runner: macos-26 }
        incognito: [off, on]
        # Default off so include rows with tor:on are added as new jobs
        # instead of merging into (and replacing) the normal brave/off jobs.
        tor: [off]
        # Tor Browser has no distinct incognito mode (and --incognito is a no-op).
        # Still copy tor results into private/ / nightly-private/ after the run.
        exclude:
          - browser: tor
            incognito: on
          - browser: tor-nightly
            incognito: on
        # Brave Tor windows don't fit in the matrix; add fixed iterations here instead.
        include:
          - { browser: brave, repetitions: { id: 1, runner: macos-26 }, incognito: off, tor: on }
          - { browser: brave, repetitions: { id: 2, runner: macos-15 }, incognito: off, tor: on }
          - { browser: brave, repetitions: { id: 3, runner: macos-26-intel }, incognito: off, tor: on }
          - { browser: brave, repetitions: { id: 4, runner: macos-15-intel }, incognito: off, tor: on }
          - { browser: brave, repetitions: { id: 5, runner: macos-26 }, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: { id: 1, runner: macos-26 }, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: { id: 2, runner: macos-15 }, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: { id: 3, runner: macos-26-intel }, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: { id: 4, runner: macos-15-intel }, incognito: off, tor: on }
          - { browser: brave-nightly, repetitions: { id: 5, runner: macos-26 }, incognito: off, tor: on }
    runs-on: ${{ matrix.repetitions.runner }}
    defaults:
      run:
        working-directory: scripts
    env:
      # Browser slug in the artifact name (matrix browser, plus -tor for Brave Tor windows).
      RESULT_BROWSER: ${{ matrix.tor == 'on' && format('{0}-tor', matrix.browser) || matrix.browser }}
      RESULT_PRIVATE: ${{ (matrix.incognito == 'on' || matrix.tor == 'on') && 'true' || 'false' }}
      RESULT_REP: ${{ matrix.repetitions.id }}

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/macos-test-setup

      - name: Install browser
        run: node desktop-install ${{ matrix.browser }}

      - name: Start DNS monitor
        run: sudo node monitor-dns.js &

      - name: Run tests
        run: |
          if [ "$RESULT_PRIVATE" = "true" ]; then
            RESULT_FILE="${RESULT_BROWSER}-private-${RESULT_REP}"
          else
            RESULT_FILE="${RESULT_BROWSER}-${RESULT_REP}"
          fi
          echo "RESULT_FILE=${RESULT_FILE}" >> "$GITHUB_ENV"
          node test --browser=${{ matrix.browser }}${{ matrix.incognito == 'on' && ' --incognito' || '' }}${{ matrix.tor == 'on' && ' --tor' || '' }} --runner=${{ matrix.repetitions.runner }} --out=../${RESULT_FILE}.json
          # Tor Browser has no distinct incognito mode; also include on the private-modes page.
          if [ "${{ matrix.browser }}" = "tor" ] || [ "${{ matrix.browser }}" = "tor-nightly" ]; then
            cp "../${RESULT_FILE}.json" "../${RESULT_BROWSER}-private-${RESULT_REP}.json"
            cp "../${RESULT_FILE}.html" "../${RESULT_BROWSER}-private-${RESULT_REP}.html"
          fi
        timeout-minutes: 90

      - name: Upload results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ env.RESULT_FILE }}-results
          path: |
            ${{ env.RESULT_FILE }}.json
            ${{ env.RESULT_FILE }}.html
            ${{ env.RESULT_BROWSER }}-private-${{ env.RESULT_REP }}.json
            ${{ env.RESULT_BROWSER }}-private-${{ env.RESULT_REP }}.html
            failure.png
          if-no-files-found: warn

  render-results:
    needs: desktop-tests
    uses: ./.github/workflows/render-results.yml
    with:
      artifact-name: rendered-pages
      paths: |
        index.html
        index.json
        private.html
        private.json
        nightly.html
        nightly.json
        nightly-private.html
        nightly-private.json
