name: Preflight

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for preflight checks
        type: string
        required: true

jobs:
  checks:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v5

      - name: Install curl with HTTP/3
        run: |
          brew install curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"

      - name: Run preflight checks
        run: bash infra/preflight.sh
