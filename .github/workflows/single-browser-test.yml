name: Single browser test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        required: true
        type: choice
        options:
          - desktop
          - android
          - ios
        default: desktop
      browser:
        description: Browser slug (e.g. chrome, brave, vivaldi)
        required: true
        type: string
        default: chrome
      nightly:
        description: Use nightly / canary / alpha build
        required: true
        type: boolean
        default: false
      incognito:
        description: Incognito / private window (desktop only)
        required: true
        type: boolean
        default: false
      tor:
        description: Brave Tor window (desktop Brave only)
        required: true
        type: boolean
        default: false
      runners:
        description: Desktop runners (ignored for android/ios)
        required: true
        type: choice
        options:
          - latest
          - all
        default: latest
      categories:
        description: Test categories to run (all = default set for the platform)
        required: true
        type: choice
        options:
          - all
          - session
          - main
          - misc
          - https
          - trackingCookies
          - dns
          - deviceFingerprint
          - settingsFingerprint
        default: all

env:
  CI: true
  GITHUB_TOKEN: ${{ github.token }}
  # capture-website pulls in puppeteer; CI doesn't generate previews, so skip its Chrome download.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  test:
    strategy:
      fail-fast: false
      # Desktop: one job on macos-latest, or the same 5 OS×arch slots as desktop-tests.yml.
      # Mobile: a single placeholder so the matrix still has one cell.
      matrix:
        config: ${{ inputs.platform != 'desktop' && fromJSON('[{"id":1,"runner":"mobile"}]') || (inputs.runners == 'all' && fromJSON('[{"id":1,"runner":"macos-26"},{"id":2,"runner":"macos-15"},{"id":3,"runner":"macos-26-intel"},{"id":4,"runner":"macos-15-intel"},{"id":5,"runner":"macos-26"}]') || fromJSON('[{"id":1,"runner":"macos-latest"}]')) }}
    runs-on: ${{ inputs.platform == 'desktop' && matrix.config.runner || fromJSON('["self-hosted","mobile"]') }}
    # Share the mobile device with Mobile tests; desktop runs don't need that queue.
    concurrency:
      group: ${{ inputs.platform == 'desktop' && format('single-desktop-{0}-{1}', github.run_id, matrix.config.id) || 'mobile-tests' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: scripts
    # Inputs are uniform for the run; only RESULT_REP varies across the matrix.
    env:
      RESULT_BROWSER: ${{ inputs.platform != 'desktop' && format('{0}-{1}{2}', inputs.platform, inputs.browser, inputs.nightly && '-nightly' || '') || format('{0}{1}{2}', inputs.browser, inputs.nightly && '-nightly' || '', inputs.tor && '-tor' || '') }}
      RESULT_PRIVATE: ${{ inputs.platform == 'desktop' && (inputs.incognito || inputs.tor) && 'true' || 'false' }}
      RESULT_REP: ${{ matrix.config.id }}

    steps:
      - uses: actions/checkout@v5

      - name: Ensure Appium is running
        if: inputs.platform != 'desktop'
        run: bash ../infra/ensure-appium.sh

      - name: Validate inputs
        run: |
          if [ -z '${{ inputs.browser }}' ]; then
            echo "browser must be non-empty"
            exit 1
          fi
          if [ '${{ inputs.tor }}' = 'true' ] && [ '${{ inputs.browser }}' != 'brave' ]; then
            echo "tor is only supported with browser=brave (got browser=${{ inputs.browser }})"
            exit 1
          fi
          if [ '${{ inputs.incognito }}' = 'true' ] && [ '${{ inputs.platform }}' != 'desktop' ]; then
            echo "Note: incognito is ignored for ${{ inputs.platform }}"
          fi
          if [ '${{ inputs.runners }}' = 'all' ] && [ '${{ inputs.platform }}' != 'desktop' ]; then
            echo "Note: runners=all is ignored for ${{ inputs.platform }} (self-hosted mobile only)"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install mkcert
        if: inputs.platform == 'desktop'
        run: |
          # macos images ship with aws/tap pre-tapped but untrusted; brew warns on every command until trusted.
          brew trust aws/tap
          brew install mkcert
          mkcert -install

      - name: Install browser
        if: inputs.platform == 'desktop'
        run: node desktop-install ${{ inputs.nightly && format('{0}-nightly', inputs.browser) || inputs.browser }}

      - name: Start DNS monitor
        if: inputs.platform == 'desktop'
        run: sudo node monitor-dns.js &

      - name: Run tests
        run: |
          if [ "$RESULT_PRIVATE" = "true" ]; then
            RESULT_FILE="${RESULT_BROWSER}-private-${RESULT_REP}"
          else
            RESULT_FILE="${RESULT_BROWSER}-${RESULT_REP}"
          fi
          echo "RESULT_FILE=${RESULT_FILE}" >> "$GITHUB_ENV"
          CATEGORIES_ARGS=()
          if [ '${{ inputs.categories }}' != 'all' ]; then
            CATEGORIES_ARGS=(--categories=${{ inputs.categories }})
          fi
          if [ '${{ inputs.platform }}' = 'desktop' ]; then
            node test \
              --browser=${{ inputs.browser }} \
              --nightly=${{ inputs.nightly }} \
              --incognito=${{ inputs.incognito }} \
              --tor=${{ inputs.tor }} \
              --runner=${{ matrix.config.runner }} \
              --out=../${RESULT_FILE}.json \
              "${CATEGORIES_ARGS[@]}"
          else
            node test \
              --${{ inputs.platform }} \
              --browser=${{ inputs.browser }} \
              --nightly=${{ inputs.nightly }} \
              --out=../${RESULT_FILE}.json \
              "${CATEGORIES_ARGS[@]}"
          fi
        timeout-minutes: 20

      - name: Upload results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ env.RESULT_FILE }}-results
          path: |
            ${{ env.RESULT_FILE }}.json
            ${{ env.RESULT_FILE }}.html
            failure.png
          if-no-files-found: warn

  render-results:
    needs: test
    uses: ./.github/workflows/render-results.yml
    with:
      artifact-name: rendered-pages
      # Whatever render-multiple wrote at repo root for this run.
      paths: |
        *.html
        *.json
