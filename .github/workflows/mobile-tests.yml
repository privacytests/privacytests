name: Mobile tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: mobile-tests
  cancel-in-progress: false

env:
  CI: true
  GITHUB_TOKEN: ${{ github.token }}
  # capture-website pulls in puppeteer; CI doesn't generate previews, so skip its Chrome download.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  android-preflight:
    needs: preflight
    runs-on: [self-hosted, mobile]
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5

      - name: Ensure Appium is running
        run: bash ../infra/ensure-appium.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update Android apps via Play Store
        run: node android-preflight.js
        timeout-minutes: 50

  mobile-tests:
    needs: android-preflight
    strategy:
      fail-fast: false
      # One Appium host / device pair — do not parallelize matrix cells.
      max-parallel: 1
      matrix:
        repetitions: [1, 2, 3, 4, 5]
        # Cartesian product with repetitions; platform-specific browser lists.
        config:
          # Android
          - { platform: android, browser: brave }
          - { platform: android, browser: chrome }
          - { platform: android, browser: duckduckgo }
          - { platform: android, browser: edge }
          - { platform: android, browser: firefox }
          - { platform: android, browser: focus }
          - { platform: android, browser: opera }
          - { platform: android, browser: samsung }
          - { platform: android, browser: tor }
          - { platform: android, browser: vivaldi }
          - { platform: android, browser: yandex }
          # iOS
          - { platform: ios, browser: brave }
          - { platform: ios, browser: chrome }
          - { platform: ios, browser: duckduckgo }
          - { platform: ios, browser: edge }
          - { platform: ios, browser: firefox }
          - { platform: ios, browser: focus }
          - { platform: ios, browser: safari }
          - { platform: ios, browser: vivaldi }
    #      - { platform: ios, browser: onion }
    runs-on: [self-hosted, mobile]
    defaults:
      run:
        working-directory: scripts
    env:
      PLATFORM: ${{ matrix.config.platform }}
      BROWSER: ${{ matrix.config.browser }}

    steps:
      - uses: actions/checkout@v5

      - name: Ensure Appium is running
        run: bash ../infra/ensure-appium.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ env.PLATFORM }} tests
        run: |
          RESULT_FILE="${PLATFORM}-${BROWSER}-${{ matrix.repetitions }}"
          echo "RESULT_FILE=${RESULT_FILE}" >> "$GITHUB_ENV"
          node test --${PLATFORM} --browser=${BROWSER} --out=../${RESULT_FILE}.json
        timeout-minutes: 90

      - name: Upload results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ env.RESULT_FILE }}-results
          path: |
            ${{ env.RESULT_FILE }}.json
            ${{ env.RESULT_FILE }}.html
            failure.png
          if-no-files-found: warn

  render-results:
    needs: mobile-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download test results
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: '*-results'

      - name: Render android and ios
        run: node render-multiple --dir=../artifacts --out-dir=..

      - name: Upload rendered pages
        uses: actions/upload-artifact@v6
        with:
          name: mobile-rendered-pages
          path: |
            android.html
            android.json
            ios.html
            ios.json
          if-no-files-found: warn
